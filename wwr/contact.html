<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Ridge Rafting</title>
    <meta name="description" content="Contact Rapid Ridge Rafting for trip bookings, river tour questions, office location, phone and email details, and team profiles.">
    <meta name="author" content="ISHIMWE Jean">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rapid Ridge Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Rapid Ridge Rafting</h1>
            <p>123 Main River Street, Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:info@rapidridgerafting.com">info@rapidridgerafting.com</a></p>
        </section>

        <section class="contact-layout">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12627.194873145638!2d-113.0263!3d37.2753!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1700000000000" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Rapid Ridge Rafting Location Map"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-field">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Your full name" required>
                </div>

                <div class="form-field">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="you@example.com" required>
                </div>

                <fieldset class="purpose-fieldset">
                    <legend>Message Purpose</legend>
                    <label class="option-label">
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>
                    <label class="option-label">
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>
                    <label class="option-label">
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-field message-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here..." required></textarea>
                </div>

                <div class="newsletter-field">
                    <label class="option-label" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/client.jpg" alt="Portrait of Elena Vance, Operations Manager">
                    <figcaption>Elena Vance — Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employeeo-mom.jpg" alt="Portrait of Marcus Reid, Lead River Guide">
                    <figcaption>Marcus Reid — Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-jean.jpg" alt="Portrait of Hannah Brooks, Guest Services Coordinator">
                    <figcaption>Hannah Brooks — Guest Services Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Rapid Ridge Rafting | ISHIMWE Jean</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
